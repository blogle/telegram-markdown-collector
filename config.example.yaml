timezone: UTC
telegram:
  api_id_env: TELEGRAM_API_ID
  api_hash_env: TELEGRAM_API_HASH
  session_path: ./var/telegram.session
  phone_env: TELEGRAM_PHONE
  code_env: TELEGRAM_CODE
  password_env: TELEGRAM_PASSWORD
state:
  database: ./var/state.sqlite3
  archive_root: ./var/archive
  work: ./var/work
output:
  root: ./output
  attachment_root: ./var/attachments
  # Daily notes larger than this byte budget are split into retrieval-sized
  # `.part-NNNN.md` files behind a small `YYYY-MM-DD.md` index. Defaults to
  # 49152 (48 KiB) to stay within Markdown-vault single-read ceilings; minimum
  # 4096. A single message whose own block exceeds the budget fails the render
  # rather than producing an unreadable part.
  max_markdown_bytes: 49152
health:
  listen: 0.0.0.0:8080
streams:
  - chat_id: 123456789
    slug: example-chat
    title: Example Chat
    output_subdirectory: chats/example-chat
    backfill:
      from: 2024-01-01
